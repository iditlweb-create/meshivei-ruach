<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>משיבי רוח — מערכת האייקונים</title>
<link rel="preload" href="assets/fonts/basalt-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/discovery-light.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Basalt;src:url("assets/fonts/basalt-medium.woff2") format("woff2");font-display:swap}
@font-face{font-family:Discovery;src:url("assets/fonts/discovery-light.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#FAF7F0;color:#1C2A17;font-family:Discovery,Arial,sans-serif}
.sheet{min-height:100svh;padding:5vw 4vw}.head{display:flex;align-items:end;justify-content:space-between;gap:40px;margin-bottom:5vw}
.eyebrow{font-size:.78rem;letter-spacing:.14em;color:#747B4D}.head h1{font-family:Basalt,serif;font-size:clamp(3.2rem,6vw,6.6rem);line-height:.95;margin:.7rem 0 0}
.note{max-width:31ch;font-size:1.05rem;line-height:1.6;color:#5d654c}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;direction:rtl}
.tile{position:relative;min-height:390px;padding:34px;display:flex;flex-direction:column;justify-content:flex-end;background:#E9DEC9;border-radius:18px;overflow:hidden}
.tile:nth-child(odd){background:#4F5639;color:#FAF7F0}.tile svg{position:absolute;inset:44px 50% auto auto;transform:translateX(50%);width:170px;height:170px;fill:none;stroke:currentColor;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;shape-rendering:geometricPrecision;opacity:.62}
.tile span{font-size:.72rem;letter-spacing:.14em;opacity:.62}.tile h2{font-size:1.55rem;font-weight:500;margin:8px 0 0}
@media(max-width:900px){.head{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.tile{min-height:320px}}
@media(max-width:540px){.sheet{padding:40px 20px}.grid{grid-template-columns:1fr}.tile{min-height:290px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>

  <symbol id="resilience" viewBox="0 0 96 96"><path d="M48 10 76 21v21c0 18-10.8 32.2-28 42-17.2-9.8-28-24-28-42V21Z"/><path d="M48 69V43M48 57c-10 0-17-6-18-17 11-1 18 4 18 15M48 50c10 0 17-6 18-17-11-1-18 4-18 15"/></symbol>
  <symbol id="identity" viewBox="0 0 96 96"><circle cx="48" cy="28" r="11"/><circle cx="24" cy="38" r="9"/><circle cx="72" cy="38" r="9"/><path d="M27 79c1-19 9-29 21-29s20 10 21 29M8 78c1-15 7-23 16-23 5 0 9 2 12 6M88 78c-1-15-7-23-16-23-5 0-9 2-12 6"/><path d="M24 20c6-7 14-11 24-11s18 4 24 11"/></symbol>
  <symbol id="sources" viewBox="0 0 96 96"><path d="M10 23c14-4 27-1 38 9v49C37 71 24 68 10 72ZM86 23c-14-4-27-1-38 9v49c11-10 24-13 38-9Z"/><path d="M18 35c9-1 17 2 24 8M78 35c-9-1-17 2-24 8M18 49c9-1 17 2 24 8M78 49c-9-1-17 2-24 8M48 32v49"/><path d="m75 10 2.3 6.2L84 19l-6.7 2.7L75 28l-2.4-6.3L66 19l6.6-2.8Z"/></symbol>
</defs></svg>
<main class="sheet">
  <header class="head"><div><p class="eyebrow">משיבי רוח · מערכת קו</p><h1>ארבעה מרחבי עיסוק</h1></div><p class="note">אייקונים בקו אחיד, חד ועדין, שנוצרו במיוחד לשפה החזותית של האתר.</p></header>
  <section class="grid" aria-label="תצוגת האייקונים">
    <article class="tile"><svg aria-hidden="true"><use href="#meaning"/></svg><span>01</span><h2>משמעות בעבודה</h2></article>
    <article class="tile"><svg aria-hidden="true"><use href="#resilience"/></svg><span>02</span><h2>חוסן בתקופות משבר</h2></article>
    <article class="tile"><svg aria-hidden="true"><use href="#identity"/></svg><span>03</span><h2>זהות ושייכות</h2></article>
    <article class="tile"><svg aria-hidden="true"><use href="#sources"/></svg><span>04</span><h2>מקורות השראה</h2></article>
  </section>
</main>
</body>
</html>
